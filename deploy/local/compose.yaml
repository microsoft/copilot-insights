# Local quick start: the Copilot Insights image (collector with the unauthenticated local profile, portal, and admin MCP) and a dashboard.
# Every port is published on 127.0.0.1 only. Do not expose this stack to other machines.
name: copilot-insights

services:
  insights:
    build:
      context: ../..
    image: copilot-insights:local
    environment:
      COPILOT_INSIGHTS_COLLECTOR_PROFILE: local
      CI_ORGANIZATION_ID: local-vscode
      INSIGHTS_MODE: local
      INSIGHTS_ORGANIZATION_ID: local-vscode
      INSIGHTS_ORGANIZATION_NAME: My VS Code organization
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
      - "127.0.0.1:3000:8080"
    volumes:
      - ./.data:/data
      - insights-reviews:/app/state
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - dashboard
    restart: unless-stopped

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.1@sha256:613f297a274958abd85e7b71664f51fb42b0ddeb697ebd4c159677774433345b
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
    restart: unless-stopped

volumes:
  insights-reviews:
